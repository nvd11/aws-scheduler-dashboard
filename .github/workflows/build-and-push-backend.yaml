name: Build and Push Scheduler Backend Image

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-and-push-backend.yaml"
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvd11/scheduler-backend

jobs:
  test:
    name: JUnit 5 & JaCoCo Gate (>=80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Unit Tests & Enforce >=80% Coverage
        run: ./mvnw clean test

  build-and-push:
    name: Native Build & Push (ARM64 for radxa-cubie-a7a)
    needs: test
    # 🎯 采用 GitHub 官方原生 ARM64 Runner (4 vCPU, 16GB RAM)
    # 彻底告别慢吞吞的 QEMU 模拟，实现 GraalVM/Mandrel Native 极速编译！
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push native ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.native
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record manifest digest
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          {
            echo "### 🚀 Published Native ARM64 Backend Image"
            echo
            echo '- Repository: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`'
            echo '- Platform: `linux/arm64 (GraalVM Native binary for radxa-cubie-a7a)`'
            echo '- Manifest digest: `${{ steps.build.outputs.digest }}`'
            echo '- Commit: `${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update GitOps image digest
        if: ${{ vars.ENABLE_GITOPS_DIGEST_DISPATCH == 'true' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.ARGOCD_MANIFESTS_DISPATCH_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "ARGOCD_MANIFESTS_DISPATCH_TOKEN is required when GitOps dispatch is enabled" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected manifest digest format: $IMAGE_DIGEST" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --url https://api.github.com/repos/nvd11/my-argocd-manifests/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -n \
              --arg digest "$IMAGE_DIGEST" \
              '{event_type:"update-app-image-digest",client_payload:{svc_name:"scheduler-backend",image_digest:$digest}}')")"

          echo "GitOps dispatch HTTP status: $http_status"
          echo "GitOps digest: $IMAGE_DIGEST"
          if [[ "$http_status" != "204" ]]; then
            cat "$response_file" >&2
            exit 1
          fi
