# ==============================================================================
# Quarkus HTTP & Server Configuration
# ==============================================================================
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:5173,https://gw.jppwl.asia,https://gw-tx.jppwl.asia}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-auth-request-user,x-auth-request-preferred-username,x-auth-request-email,x-auth-request-access-token
quarkus.http.cors.access-control-allow-credentials=true

# ==============================================================================
# Application & Auth Configuration
# ==============================================================================
app.env=${APP_ENV:local}
app.auth.enabled=${APP_AUTH_ENABLED:false}
app.auth.mode=${APP_AUTH_MODE:forward-auth}
app.auth.logto-endpoint=${APP_LOGTO_ENDPOINT:https://sodaxw.logto.app}

# ==============================================================================
# AWS & EventBridge Configuration
# ==============================================================================
app.aws.region=${AWS_REGION:ap-southeast-1}
app.aws.account-id=${AWS_ACCOUNT_ID:186004631963}
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.scheduler-group=${AWS_SCHEDULER_GROUP:default}
app.aws.event-bus-name=${AWS_EVENT_BUS_NAME:default}

# ==============================================================================
# GitHub API & Cache Configuration
# ==============================================================================
app.github.token=${GITHUB_TOKEN:}
app.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
app.cache.topology-ttl-seconds=${TOPOLOGY_CACHE_TTL_SECONDS:60}
app.cache.run-history-ttl-seconds=${RUN_HISTORY_CACHE_TTL_SECONDS:15}
app.cache.user-info-ttl-seconds=${USER_INFO_CACHE_TTL_SECONDS:300}

# ==============================================================================
# GraalVM Native Configuration
# ==============================================================================
quarkus.native.enable-https-url-handler=true
quarkus.native.additional-build-args=--link-at-build-time=
