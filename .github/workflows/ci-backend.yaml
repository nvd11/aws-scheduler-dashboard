name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yaml"
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: JUnit 5 Tests & JaCoCo Coverage (>=80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run JUnit 5 Suite & Enforce JaCoCo >=80% Coverage Gate
        run: |
          ./mvnw clean test

      - name: Publish Coverage Summary
        if: always()
        run: |
          if [[ -f target/site/jacoco/jacoco.csv ]]; then
            echo "### 📊 Backend JaCoCo Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            awk -F',' 'NR>1 {inst_m+=$4; inst_c+=$5; line_m+=$8; line_c+=$9} END {
              inst_tot=inst_m+inst_c; line_tot=line_m+line_c;
              printf "- **Instruction Coverage**: `%.1f%%` (%d / %d)\n", (inst_c*100.0/inst_tot), inst_c, inst_tot;
              printf "- **Line Coverage**: `%.1f%%` (%d / %d)\n", (line_c*100.0/line_tot), line_c, line_tot;
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14
